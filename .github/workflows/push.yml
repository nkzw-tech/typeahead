name: push
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '24'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      - run: vp run test:all
